<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My DevOps Project</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#007bff,#00d4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:40px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
    color:#007bff;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:20px;
}

button{
    background:#007bff;
    color:#fff;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}
</style>

</head>

<body>

<div class="container">
    <h1>🚀 CI/CD Pipeline</h1>
    <p>Website deployed using GitHub + Jenkins + Apache</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="demo"></p>
</div>

<script>
function showMessage(){
    document.getElementById("demo").innerHTML="heyyy sucsseful";
}
</script>

</body>
</html>
